name: apps
# Builds the Android APK, Windows installer and Tizen package with the latest
# catalog bundled in. Run it from the Actions tab, or push a tag like v0.2.0
# to also publish a GitHub Release with the files.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions: { contents: write }
env:
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd curator && node src/cli.mjs build
      - uses: actions/upload-artifact@v4
        with: { name: bundle, path: dist/bundle }

  android:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bundle, path: dist/bundle }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build APK
        working-directory: platforms/android
        run: |
          npm install
          npx cap add android
          ./patch-manifest.sh
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../../NostalgiaOrbit.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: NostalgiaOrbit.apk }

  windows:
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bundle, path: dist/bundle }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build installer
        working-directory: platforms/windows
        run: |
          npm install
          npm run icons
          npm run build
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: platforms/windows/src-tauri/target/release/bundle/nsis/*.exe }

  tizen:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bundle, path: dist/bundle }
      - run: platforms/tizen/build-wgt.sh
      - uses: actions/upload-artifact@v4
        with: { name: tizen-unsigned-wgt, path: dist/NostalgiaOrbit-unsigned.wgt }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, tizen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "out/*" }
